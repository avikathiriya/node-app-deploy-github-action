
name: Node.js Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SSH secrets are available
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [[ -n "$SSH_KEY" ]]; then
            echo "SSH_KEY is present"
          else
            echo "::error::SSH_KEY is EMPTY or unavailable. Check repository Actions secrets."
            exit 1
          fi

          if [[ -n "$SSH_HOST" ]]; then
            echo "SSH_HOST is present"
          else
            echo "::error::SSH_HOST is EMPTY or unavailable. Check repository Actions secrets."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e

            cd /home/ubuntu/node-app-deploy-github-action

            echo "===== Current Git Commit ====="
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline

            echo "===== Verify Updated Source ====="
            grep -n "Hello from the server" .

            echo "===== Rebuild and Restart Containers ====="
            docker compose down
            docker compose build --no-cache
            docker compose up -d --force-recreate

            echo "===== Running Containers ====="
            docker compose ps

            echo "===== Container Logs ====="
            docker compose logs --tail=50
